<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LIFF Connection Test</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      padding: 30px;
      text-align: center;
    }

    .box {
      max-width: 450px;
      margin: 40px auto;
      padding: 25px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.1);
    }

    button {
      padding: 12px 24px;
      font-size: 16px;
      border: none;
      border-radius: 10px;
      background: #06C755;
      color: white;
      cursor: pointer;
      margin: 10px;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #status {
      margin: 20px 0;
      word-break: break-word;
    }
  </style>
</head>

<body>

  <div class="box">
    <h2>LIFF Connection Test</h2>
    <p>ทดสอบการเชื่อมต่อ LINE กับ Apps Script</p>

    <p id="status">กำลังเริ่มต้น LIFF...</p>

    <button id="loginButton" style="display:none;">
      เข้าสู่ระบบด้วย LINE
    </button>

    <div id="profile"></div>

    <button id="sendButton" style="display:none;">
      ส่งข้อมูลทดสอบ
    </button>

    <p id="sendStatus"></p>
  </div>

  <script>
    const LIFF_ID = "ใส่ LIFF ID เดิมของคุณ";

    const GAS_URL = "ใส่ URL Web App ที่ลงท้ายด้วย exec";

    let userProfile = null;

    async function initializeLiff() {
      try {
        await liff.init({ liffId: LIFF_ID });

        document.getElementById("status").textContent =
          "LIFF เริ่มต้นสำเร็จ";

        if (liff.isLoggedIn()) {
          userProfile = await liff.getProfile();

          document.getElementById("profile").innerHTML =
            "<p>เข้าสู่ระบบสำเร็จ</p>" +
            "<p>ชื่อ: " + userProfile.displayName + "</p>";

          document.getElementById("sendButton").style.display =
            "inline-block";

        } else {
          document.getElementById("loginButton").style.display =
            "inline-block";
        }

      } catch (error) {
        document.getElementById("status").textContent =
          "เกิดข้อผิดพลาด: " + error.message;

        console.error(error);
      }
    }

    document.getElementById("loginButton")
      .addEventListener("click", function () {
        if (!liff.isInClient() && !liff.isLoggedIn()) {
          liff.login();
        }
      });

    document.getElementById("sendButton")
      .addEventListener("click", async function () {

        if (!userProfile) {
          document.getElementById("sendStatus").textContent =
            "ยังไม่มีข้อมูลโปรไฟล์ LINE";
          return;
        }

        const button = document.getElementById("sendButton");

        button.disabled = true;

        document.getElementById("sendStatus").textContent =
          "กำลังส่งข้อมูล...";

        const data = {
          displayName: userProfile.displayName,
          userId: userProfile.userId
        };

        try {

          await fetch(GAS_URL, {
            method: "POST",
            mode: "no-cors",
            headers: {
              "Content-Type": "text/plain;charset=utf-8"
            },
            body: JSON.stringify(data)
          });

          document.getElementById("sendStatus").textContent =
            "ส่งคำขอแล้ว กรุณาตรวจสอบ Apps Script Logs";

        } catch (error) {

          document.getElementById("sendStatus").textContent =
            "เกิดข้อผิดพลาดในการส่ง: " + error.message;

          button.disabled = false;
        }
      });

    initializeLiff();
  </script>

</body>
</html>

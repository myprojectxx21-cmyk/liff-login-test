
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LIFF Login Test</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      padding: 30px;
      text-align: center;
    }

    .box {
      max-width: 450px;
      margin: 40px auto;
      padding: 25px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.1);
    }

    button {
      padding: 12px 24px;
      font-size: 16px;
      border: none;
      border-radius: 10px;
      background: #06C755;
      color: white;
      cursor: pointer;
    }

    #status {
      margin: 20px 0;
      word-break: break-word;
    }
  </style>
</head>

<body>

  <div class="box">
    <h2>LIFF Login Test</h2>
    <p>ทดสอบการเข้าสู่ระบบด้วย LINE</p>

    <p id="status">กำลังเริ่มต้น LIFF...</p>

    <button id="loginButton" style="display:none;">
      เข้าสู่ระบบด้วย LINE
    </button>

    <div id="profile"></div>
  </div>

  <script>
    const LIFF_ID = "2012780706-R61ijjrS";

    async function initializeLiff() {
      try {
        await liff.init({ liffId: LIFF_ID });

        document.getElementById("status").textContent =
          "LIFF เริ่มต้นสำเร็จ";

        if (liff.isLoggedIn()) {
          const profile = await liff.getProfile();

          document.getElementById("profile").innerHTML =
            "<p>เข้าสู่ระบบสำเร็จ</p>" +
            "<p>ชื่อ: " + profile.displayName + "</p>" +
            "<p>User ID: " + profile.userId + "</p>";

          document.getElementById("loginButton").style.display = "none";
        } else {
          document.getElementById("loginButton").style.display =
            "inline-block";
        }

      } catch (error) {
        document.getElementById("status").textContent =
          "เกิดข้อผิดพลาด: " + error.message;
        console.error(error);
      }
    }

    document.getElementById("loginButton")
      .addEventListener("click", function () {
        if (!liff.isInClient() && !liff.isLoggedIn()) {
          liff.login();
        }
      });

    initializeLiff();
  </script>

</body>
</html>
